# 每次 push 到 main（例如指揮艙發布新簡報、改 decks.json）時，
# 重新產生 sitemap.xml 與首頁 index.html 的靜態社區／物件清單，有變動才自動 commit。
# 這個 repo 有 .nojekyll，GitHub Pages 不跑 Jekyll，所以 sitemap 不用 jekyll-sitemap，改由這裡產生。
name: build-site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastmod 與 index.html 還原要讀 git 歷史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 產生 sitemap.xml 與首頁靜態清單
        run: python3 scripts/build_site.py

      # 2026-11-03：各頁 <head> 的 JSON-LD、noscript 摘要與 llms.txt（data/videos.json 加影片也會更新）
      - name: 產生結構化資料與 llms.txt
        run: python3 scripts/structured_data.py .

      - name: 有變動才 commit
        run: |
          git config core.quotepath false
          if [ -z "$(git status --porcelain -- index.html sitemap.xml llms.txt '*.html')" ]; then
            echo "沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml llms.txt '*.html'
          git commit -m "自動更新 sitemap.xml、首頁靜態清單與結構化資料（依 decks.json）"
          # 2026-11-11：建置期間若有人又推了新提交，直接 push 會被拒絕（fetch first）。
          # 改成：拉最新再推，被拒就重試，最多 3 次。
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "推送被拒絕，第 $i 次重試"
            sleep 5
          done
          echo "推送重試 3 次仍失敗"
          exit 1
