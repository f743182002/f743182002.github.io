# 每次 push 到 main（例如指揮艙發布新簡報、改 decks.json）時，
# 重新產生 sitemap.xml 與首頁 index.html 的靜態社區／物件清單，有變動才自動 commit。
# 這個 repo 有 .nojekyll，GitHub Pages 不跑 Jekyll，所以 sitemap 不用 jekyll-sitemap，改由這裡產生。
name: build-site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastmod 與 index.html 還原要讀 git 歷史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 每次嘗試都先對齊最新的 origin/main 再產生，不做 rebase，
      # 指揮艙連續 push 時也不會因 rebase 衝突失敗；push 被拒就重來，最多 3 次。
      - name: 產生 sitemap.xml 與首頁靜態清單，有變動才 commit + push
        run: |
          git config core.quotepath false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "第 ${attempt} 次嘗試"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_site.py
            if git diff --quiet -- index.html sitemap.xml; then
              echo "沒有變動"
              exit 0
            fi
            git add index.html sitemap.xml
            git commit -m "自動更新 sitemap.xml 與首頁靜態清單（依 decks.json）"
            if git push origin HEAD:main; then
              echo "已推送"
              exit 0
            fi
            echo "push 失敗（main 可能有新 commit），5 秒後重試"
            sleep 5
          done
          echo "重試 3 次仍無法 push"
          exit 1
