# 每次 push 到 main（例如指揮艙發布新簡報、改 decks.json）時，
# 重新產生 sitemap.xml 與首頁 index.html 的靜態社區／物件清單，有變動才自動 commit。
# 這個 repo 有 .nojekyll，GitHub Pages 不跑 Jekyll，所以 sitemap 不用 jekyll-sitemap，改由這裡產生。
name: build-site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastmod 與 index.html 還原要讀 git 歷史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 產生 sitemap.xml 與首頁靜態清單
        run: python3 scripts/build_site.py

      - name: 有變動才 commit
        run: |
          git config core.quotepath false
          if git diff --quiet -- index.html sitemap.xml; then
            echo "沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "自動更新 sitemap.xml 與首頁靜態清單（依 decks.json）"
          git pull --rebase origin main
          git push origin HEAD:main
