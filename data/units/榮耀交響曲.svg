<text x="24" y="884" font-size="14" fill="#1F2B33">・資料來源：內政部不動產交易實價查詢服務網（已排除特殊交易），不含預售屋（完工前簽約者）。</text>
<text x="24" y="905" font-size="14" fill="#1F2B33">・資料期間：民國110年第2季起登錄的成交，截至 115/11/01 公布；之後的新成交未納入，以內政部最新資料為準。</text>
<text x="24" y="926" font-size="14" fill="#1F2B33">・單價（萬元/坪）已扣除有拆分的車位；標「含車位」者未拆分，單價含車位，不列入色階與中位數。</text>
<text x="24" y="947" font-size="14" fill="#1F2B33">・同一戶（門牌＋樓層＋之幾）有多筆成交只畫最新一筆，「共N筆」是該戶在資料期間內的成交筆數。</text>
<text x="24" y="968" font-size="14" fill="#1F2B33">・中位數只算二樓以上、每戶最新一筆；一樓／店面、地下層另外標示，不與住宅樓層混比。淡灰格是資料期間內沒有成交登錄，不代表沒有住戶。</text>
<text x="24" y="989" font-size="14" fill="#1F2B33">・不依實際比例重繪，實際以現場及權狀為準。</text>
